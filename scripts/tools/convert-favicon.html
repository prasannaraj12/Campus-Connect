<!DOCTYPE html>
<html>
<head>
    <title>Favicon Converter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            text-align: center;
        }
        .upload-area {
            border: 3px dashed #ccc;
            padding: 40px;
            margin: 20px 0;
            border-radius: 10px;
            cursor: pointer;
        }
        .upload-area:hover {
            border-color: #4F46E5;
            background: #f9fafb;
        }
        canvas {
            border: 1px solid #ddd;
            margin: 20px;
        }
        button {
            background: #4F46E5;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px;
        }
        button:hover {
            background: #4338CA;
        }
        .preview {
            display: inline-block;
            margin: 20px;
        }
        img {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <h1>Favicon Generator</h1>
    <p>Upload your university logo to generate favicons</p>
    
    <div class="upload-area" onclick="document.getElementById('fileInput').click()">
        <p>📁 Click to upload your logo image</p>
        <p style="font-size: 12px; color: #666;">Supports: PNG, JPG, SVG</p>
    </div>
    <input type="file" id="fileInput" accept="image/*" style="display: none;">
    
    <div id="preview" style="display: none;">
        <h3>Preview:</h3>
        <img id="previewImg" style="max-width: 300px;">
    </div>
    
    <div id="canvasContainer" style="display: none;">
        <h3>Generated Favicons:</h3>
        <div class="preview">
            <p>16x16 (Browser Tab)</p>
            <canvas id="canvas16" width="16" height="16"></canvas>
        </div>
        <div class="preview">
            <p>32x32 (Bookmark)</p>
            <canvas id="canvas32" width="32" height="32"></canvas>
        </div>
        <div class="preview">
            <p>180x180 (Apple Touch)</p>
            <canvas id="canvas180" width="180" height="180"></canvas>
        </div>
        
        <div>
            <button onclick="downloadAll()">Download All Favicons</button>
        </div>
    </div>

    <script>
        let uploadedImage = null;

        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    uploadedImage = img;
                    
                    // Show preview
                    document.getElementById('previewImg').src = event.target.result;
                    document.getElementById('preview').style.display = 'block';
                    
                    // Generate favicons
                    generateFavicons(img);
                    document.getElementById('canvasContainer').style.display = 'block';
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        function generateFavicons(img) {
            const sizes = [16, 32, 180];
            
            sizes.forEach(size => {
                const canvas = document.getElementById(`canvas${size}`);
                const ctx = canvas.getContext('2d');
                
                // Clear canvas
                ctx.clearRect(0, 0, size, size);
                
                // Draw image
                ctx.drawImage(img, 0, 0, size, size);
            });
        }

        function downloadCanvas(canvas, filename) {
            canvas.toBlob(blob => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                a.click();
                URL.revokeObjectURL(url);
            });
        }

        function downloadAll() {
            downloadCanvas(document.getElementById('canvas16'), 'favicon-16x16.png');
            setTimeout(() => {
                downloadCanvas(document.getElementById('canvas32'), 'favicon-32x32.png');
            }, 500);
            setTimeout(() => {
                downloadCanvas(document.getElementById('canvas180'), 'apple-touch-icon.png');
            }, 1000);
            
            alert('Favicons downloaded! Move them to the public/ folder.');
        }
    </script>
</body>
</html>
